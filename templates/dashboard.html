<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Solinilla</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
        }

        .header h1 span {
            color: #667eea;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-card.success .number {
            color: #27ae60;
        }

        .stat-card.warning .number {
            color: #f39c12;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .content-header h2 {
            color: #333;
            font-size: 24px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-warning:hover {
            background: #e67e22;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #333;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .close-modal:hover {
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @media print {
            .btn-group, .btn-logout {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🍽️ Dashboard <span>Solinilla</span></h1>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>

        <!-- Stats -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Productos</h3>
                <div class="number" id="totalProductos">0</div>
            </div>
            <div class="stat-card success">
                <h3>Stock Total</h3>
                <div class="number" id="totalStock">0</div>
            </div>
            <div class="stat-card warning">
                <h3>Productos Bajos</h3>
                <div class="number" id="productosBajos">0</div>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="content-header">
                <h2>📦 Inventario Actual</h2>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="openModal('producto')">➕ Nuevo Producto</button>
                    <button class="btn btn-success" onclick="openModal('entrada')">📥 Entrada</button>
                    <button class="btn btn-warning" onclick="openModal('salida')">📤 Salida</button>
                    <button class="btn btn-info" onclick="generarPDF()">📄 Generar PDF</button>
                </div>
            </div>

            <div id="alert" class="alert"></div>

            <table id="tablaProductos">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaBody">
                    <!-- Se llena con JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Producto -->
    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ Nuevo Producto</h3>
                <button class="close-modal" onclick="closeModal('producto')">&times;</button>
            </div>
            <form id="formProducto" onsubmit="crearProducto(event)">
                <div class="form-group">
                    <label>ID del Producto</label>
                    <input type="text" id="prodId" required placeholder="Ej: ARROZ001">
                </div>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="prodNombre" required placeholder="Ej: Arroz Premium 1kg">
                </div>
                <div class="form-group">
                    <label>Fecha de Vencimiento</label>
                    <input type="date" id="prodVencimiento" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Guardar Producto</button>
            </form>
        </div>
    </div>

    <!-- Modal Movimiento -->
    <div id="modalMovimiento" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalMovimientoTitulo">📥 Registrar Movimiento</h3>
                <button class="close-modal" onclick="closeModal('movimiento')">&times;</button>
            </div>
            <form id="formMovimiento" onsubmit="registrarMovimiento(event)">
                <div class="form-group">
                    <label>Producto</label>
                    <select id="movProducto" required>
                        <option value="">Seleccione un producto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <input type="text" id="movTipo" readonly>
                </div>
                <div class="form-group">
                    <label>Cantidad</label>
                    <input type="number" id="movCantidad" required min="1" placeholder="0">
                </div>
                <div class="form-group">
                    <label>Motivo</label>
                    <textarea id="movMotivo" required rows="3" placeholder="Describa el motivo del movimiento"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Registrar Movimiento</button>
            </form>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        let productos = [];

        // Verificar autenticación
        if (!token) {
            window.location.href = '/';
        }

        // Cargar productos al iniciar
        document.addEventListener('DOMContentLoaded', () => {
            cargarProductos();
        });

        // Cargar productos desde la API
        async function cargarProductos() {
            try {
                const response = await fetch('/api/productos', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                const data = await response.json();
                productos = data.productos || [];
                renderizarTabla();
                actualizarStats();
                actualizarSelectProductos();
            } catch (error) {
                showAlert('Error al cargar productos: ' + error.message, 'error');
            }
        }

        // Renderizar tabla
        function renderizarTabla() {
            const tbody = document.getElementById('tablaBody');
            tbody.innerHTML = '';

            productos.forEach(prod => {
                const tr = document.createElement('tr');
                const stock = prod.stock || 0;
                const estado = getEstadoStock(stock);
                
                tr.innerHTML = `
                    <td><strong>${prod.id}</strong></td>
                    <td>${prod.nombre}</td>
                    <td><strong>${stock}</strong></td>
                    <td>${prod.fecha_vencimiento || 'N/A'}</td>
                    <td><span class="badge ${estado.class}">${estado.text}</span></td>
                    <td>
                        <button class="btn btn-success" style="padding: 5px 10px; font-size: 12px;" onclick="registrarEntradaRapida('${prod.id}')">📥</button>
                        <button class="btn btn-warning" style="padding: 5px 10px; font-size: 12px;" onclick="registrarSalidaRapida('${prod.id}')">📤</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            if (productos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">No hay productos registrados</td></tr>';
            }
        }

        // Obtener estado del stock
        function getEstadoStock(stock) {
            if (stock > 20) {
                return { text: '✅ Disponible', class: 'badge-success' };
            } else if (stock > 0) {
                return { text: '⚠️ Stock Bajo', class: 'badge-warning' };
            } else {
                return { text: '❌ Agotado', class: 'badge-danger' };
            }
        }

        // Actualizar estadísticas
        function actualizarStats() {
            const totalProductos = productos.length;
            const totalStock = productos.reduce((sum, p) => sum + (p.stock || 0), 0);
            const productosBajos = productos.filter(p => (p.stock || 0) <= 10).length;

            document.getElementById('totalProductos').textContent = totalProductos;
            document.getElementById('totalStock').textContent = totalStock;
            document.getElementById('productosBajos').textContent = productosBajos;
        }

        // Actualizar select de productos
        function actualizarSelectProductos() {
            const select = document.getElementById('movProducto');
            select.innerHTML = '<option value="">Seleccione un producto</option>';
            productos.forEach(prod => {
                const option = document.createElement('option');
                option.value = prod.id;
                option.textContent = `${prod.id} - ${prod.nombre} (Stock: ${prod.stock})`;
                select.appendChild(option);
            });
        }

        // Abrir modal
        function openModal(tipo) {
            if (tipo === 'producto') {
                document.getElementById('modalProducto').classList.add('active');
            } else if (tipo === 'entrada') {
                document.getElementById('movTipo').value = 'entrada';
                document.getElementById('modalMovimientoTitulo').textContent = '📥 Registrar Entrada';
                document.getElementById('modalMovimiento').classList.add('active');
            } else if (tipo === 'salida') {
                document.getElementById('movTipo').value = 'salida';
                document.getElementById('modalMovimientoTitulo').textContent = '📤 Registrar Salida';
                document.getElementById('modalMovimiento').classList.add('active');
            }
        }

        // Cerrar modal
        function closeModal(tipo) {
            if (tipo === 'producto') {
                document.getElementById('modalProducto').classList.remove('active');
                document.getElementById('formProducto').reset();
            } else if (tipo === 'movimiento') {
                document.getElementById('modalMovimiento').classList.remove('active');
                document.getElementById('formMovimiento').reset();
            }
        }

        // Crear producto
        async function crearProducto(event) {
            event.preventDefault();
            
            const data = {
                id: document.getElementById('prodId').value,
                nombre: document.getElementById('prodNombre').value,
                fecha_vencimiento: document.getElementById('prodVencimiento').value
            };

            try {
                const response = await fetch('/api/productos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showAlert('✅ ' + result.msg, 'success');
                    closeModal('producto');
                    await cargarProductos();
                } else {
                    showAlert('❌ ' + result.detail, 'error');
                }
            } catch (error) {
                showAlert('Error al crear producto: ' + error.message, 'error');
            }
        }

        // Registrar movimiento
        async function registrarMovimiento(event) {
            event.preventDefault();
            
            const data = {
                id_prod: document.getElementById('movProducto').value,
                tipo: document.getElementById('movTipo').value,
                cantidad: parseFloat(document.getElementById('movCantidad').value),
                motivo: document.getElementById('movMotivo').value
            };

            try {
                const response = await fetch('/api/movimientos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showAlert('✅ ' + result.msg, 'success');
                    closeModal('movimiento');
                    await cargarProductos();
                } else {
                    showAlert('❌ ' + result.detail, 'error');
                }
            } catch (error) {
                showAlert('Error al registrar movimiento: ' + error.message, 'error');
            }
        }

        // Registro rápido
        function registrarEntradaRapida(idProd) {
            openModal('entrada');
            document.getElementById('movProducto').value = idProd;
        }

        function registrarSalidaRapida(idProd) {
            openModal('salida');
            document.getElementById('movProducto').value = idProd;
        }

        // Generar PDF
        async function generarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Título
            doc.setFontSize(20);
            doc.setTextColor(102, 126, 234);
            doc.text('Solinilla - Inventario', 105, 20, { align: 'center' });

            // Fecha
            doc.setFontSize(12);
            doc.setTextColor(100);
            const fecha = new Date().toLocaleDateString('es-ES');
            doc.text(`Fecha: ${fecha}`, 105, 30, { align: 'center' });

            // Estadísticas
            doc.setFontSize(14);
            doc.setTextColor(0);
            doc.text(`Total Productos: ${productos.length}`, 14, 45);
            doc.text(`Stock Total: ${productos.reduce((sum, p) => sum + (p.stock || 0), 0)}`, 14, 52);

            // Tabla
            const tableData = productos.map(p => [
                p.id,
                p.nombre,
                p.stock.toString(),
                p.fecha_vencimiento || 'N/A',
                getEstadoStock(p.stock || 0).text
            ]);

            doc.autoTable({
                startY: 60,
                head: [['ID', 'Producto', 'Stock', 'Vencimiento', 'Estado']],
                body: tableData,
                theme: 'striped',
                headStyles: { fillColor: [102, 126, 234] },
                styles: { fontSize: 10 }
            });

            // Guardar
            doc.save(`inventario-solinilla-${fecha.replace(/\//g, '-')}.pdf`);
            showAlert('✅ PDF generado exitosamente', 'success');
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        // Mostrar alerta
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        // Cerrar modal al hacer clic fuera
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
    </script>
</body>
</html>
